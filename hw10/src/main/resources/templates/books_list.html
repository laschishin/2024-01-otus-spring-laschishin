<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Books</title>
    <link href="../static/styles.css" rel="stylesheet" th:href='@{/styles.css}'>
    <script src="../static/common.js" th:src='@{/common.js}'></script>
    <script src="../static/book_list.js" th:src='@{/book_list.js}'></script>
</head>
<body>

<h3>Books</h3>

<div th:insert="~{top_menu :: top_menu}"></div>

<div>
    <a href="#" th:href="@{/book/create}">
        <button type="button">Create new book</button>
    </a>
</div>

<table class="list-table" id="books-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Authors</th>
        <th>Genre</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<div>
    <span class="status_error" id="error_box" hidden ></span>
</div>

<script defer>
    fillBookList()
</script>

</body>
</html>
