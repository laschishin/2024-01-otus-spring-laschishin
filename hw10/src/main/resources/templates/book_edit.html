<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit book</title>
    <link href="../static/styles.css" rel="stylesheet" th:href='@{/styles.css}'>
    <script src="../static/js.js" th:src='@{/js.js}'></script>
</head>
<body>

<h3>Edit book</h3>

<div>
    <label for="book-id">ID</label>
    <input id="book-id"
           name="id"
           readonly="readonly"
           type="text">
</div>

<div>
    <label for="book-title">Title</label>
    <input id="book-title"
           name="title"
           type="text">
</div>

<div>
    <label for="book-authors">Authors</label>
    <select id="book-authors"
            multiple
            name="authors"></select>
</div>

<div>
    <label for="book-genre">Genre</label>
    <select id="book-genre"
            name="genre">
    </select>
</div>

<div>
    <button onclick="putBookEdit()" type="button">Save</button>
    <a href="/">
        <button type="button">Cancel</button>
    </a>
</div>

<div>
    <span class="status_error" id="error_box" hidden></span>
</div>

<script th:inline="javascript" defer>
    fillBookEdit([[${book.id}]])
</script>

</body>
</html>
