<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit book</title>
    <link href="../static/styles.css" rel="stylesheet" th:href='@{/styles.css}'>
</head>
<body>

<h3>Book details</h3>


<form action="book_edit.html"
      id="edit-form"
      th:action="@{/book/edit/__${book.id}__}"
      th:method="post"
      th:object="${book}">

    <div>
        <label for="id-input">ID</label>
        <input id="id-input"
               name="id"
               readonly="readonly"
               th:value="*{id}"
               type="text"
               value="1">
    </div>

    <div>
        <label for="book-title-input">Title</label>
        <input id="book-title-input"
               name="title"
               th:value="*{title}"
               type="text"
               value="Pro Spring 5: An In-Depth Guide to the Spring Framework and Its Tools">
    </div>

    <div>
        <label for="book-authors-input">Authors</label>
        <select id="book-authors-input"
                multiple
                name="authors">
            <option th:each="author: ${authors}"
                    th:selected="${author.isSelected}"
                    th:text="${author.getFullName}"
                    th:value="${author.getId}">Iuliana Cosmina
            </option>
        </select>
    </div>

    <div>
        <label for="book-genre-input">Genre</label>
        <select id="book-genre-input"
                name="genre">
            <option th:each="genre: ${genres}"
                    th:selected="${genre.isSelected}"
                    th:text="${genre.getName}"
                    th:value="${genre.getId}">Professional literature
            </option>
        </select>
    </div>

    <div>
        <button class="btn" type="submit">Save</button>
        <a href="books_list.html" th:href="@{/}">
            <button type="button">Cancel</button>
        </a>
    </div>

</form>
</body>
</html>
